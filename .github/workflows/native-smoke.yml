name: Native app smoke test (emulator)

# Nothing else in this repository RUNS the native app. The core tests are a
# JVM, the type check is declarations against hand-written stubs, and
# android.yml only compiles. This boots an emulator, installs the debug
# builds and drives them as a person would — first launch, an expense typed
# in by hand, a bank SMS arriving while the app is in the background — so
# "it compiles" stops being the strongest thing anyone can say about it.
#
# Separate from android.yml so the shipping APK never waits on an emulator.
# Everything the test finds is printed into the job log, screenshots
# included (base64 between SCREENSHOT-BEGIN/END lines), because not every
# environment that works on this repository can download artifacts.

on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - 'android/nativeapp/**'
      - 'core/**'
      - 'android/*.gradle'
      - 'android/gradle/**'
      - '.github/workflows/native-smoke.yml'
      - '.github/scripts/native-smoke.sh'
      - '.github/scripts/uitree.py'
  workflow_dispatch:

# One run at a time per branch. A later push waits behind the running one
# rather than cancelling it, so a busy branch still gets a finished answer.
concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      # The same setup as android.yml, step for step: settings.gradle
      # includes :app (Chaquopy needs a Python) and the Capacitor projects
      # (generated by `cap sync`), so Gradle cannot configure :nativeapp
      # without them.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Debug builds: adb-installable and `run-as`-able, which is how the
      # test reads the ledger to tell the SMS receiver's work apart from the
      # launch-time inbox scan's. One variant per invocation, as in
      # android.yml: built together, the two Room processors race on the
      # same exported schema file.
      - name: Build native debug APKs
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew :nativeapp:assembleNosmsDebug
          ./gradlew :nativeapp:assembleSmsDebug
          ls -l nativeapp/build/outputs/apk/*/debug/*.apk

      - name: Pillow, for the screenshots printed into the log
        run: python -m pip install --quiet pillow

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No AVD cache: the AVD plus its snapshot is gigabytes, against a cold
      # boot of a minute or two, and a stale snapshot is one more way for the
      # test to fail for a reason that is not the app.
      #
      # API 30, the AOSP image: light, and it ships a default SMS app, so an
      # injected message also lands in the inbox the launch-time scan reads.
      # A hardware keyboard keeps the soft keyboard from covering the form.
      - name: Boot an emulator and run the smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # One line: the action runs each line of `script` as its own sh -c.
          script: bash .github/scripts/native-smoke.sh android/nativeapp/build/outputs/apk/nosms/debug/nativeapp-nosms-debug.apk android/nativeapp/build/outputs/apk/sms/debug/nativeapp-sms-debug.apk native-smoke-out

      - name: Upload screenshots, UI dumps and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke
          if-no-files-found: ignore
          path: native-smoke-out/
