name: Native app smoke test (emulator)

# Nothing else in this repository RUNS the native app. The core tests are a
# JVM, the type check is declarations against hand-written stubs, and
# android.yml only compiles. This boots an emulator, installs the debug
# builds and drives them as a person would — first launch, an expense typed
# in by hand, a bank message copied out of Messages and pasted in, a bank SMS
# arriving while the app is in the background, a merchant's page, a category
# deleted and brought back, and an update from the last version-3 database —
# so "it compiles" stops being the strongest thing anyone can say about it.
#
# Separate from android.yml so the shipping APK never waits on an emulator.
# Everything the test finds is printed into the job log, screenshots
# included (base64 between SCREENSHOT-BEGIN/END lines), because not every
# environment that works on this repository can download artifacts.

on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - 'android/nativeapp/**'
      - 'core/**'
      - 'android/*.gradle'
      - 'android/gradle/**'
      - '.github/workflows/native-smoke.yml'
      - '.github/scripts/native-smoke.sh'
      - '.github/scripts/uitree.py'
  workflow_dispatch:

# One run at a time per branch. A later push waits behind the running one
# rather than cancelling it, so a busy branch still gets a finished answer.
concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      # The same setup as android.yml, step for step: settings.gradle
      # includes :app (Chaquopy needs a Python) and the Capacitor projects
      # (generated by `cap sync`), so Gradle cannot configure :nativeapp
      # without them.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Debug builds: adb-installable and `run-as`-able, which is how the
      # test reads the ledger to tell the SMS receiver's work apart from the
      # launch-time inbox scan's. One variant per invocation, as in
      # android.yml: built together, the two Room processors race on the
      # same exported schema file.
      - name: Build native debug APKs
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew :nativeapp:assembleNosmsDebug
          ./gradlew :nativeapp:assembleSmsDebug
          ls -l nativeapp/build/outputs/apk/*/debug/*.apk

      # Every phone that already has the app holds a version-3 ledger, and the
      # only thing standing between it and a crash on the first open after
      # an update is MIGRATION_3_4. 2b0e3c1e is the last commit whose
      # database is version 3, so the smoke test installs this build of it,
      # makes a ledger, and updates it in place to the build above.
      #
      # A worktree beside this checkout. Its build files and package.json
      # are the same as this commit's, so the Capacitor projects `cap sync`
      # generated above are what it needs. If this step fails, the smoke
      # test still runs and reports the upgrade as not done.
      - name: Build the version-3 APK to upgrade from (2b0e3c1e)
        id: v3
        continue-on-error: true
        env:
          V3_COMMIT: 2b0e3c1ecc27d16b8965e9c575c716ddbff32904
        run: |
          git fetch --no-tags --depth=1 origin "$V3_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/v3" "$V3_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/v3/node_modules"
          cp -a android/capacitor-cordova-android-plugins "$RUNNER_TEMP/v3/android/"
          mkdir -p "$RUNNER_TEMP/v3/android/app/src/main/assets"
          cp -a android/app/src/main/assets/. "$RUNNER_TEMP/v3/android/app/src/main/assets/"
          (cd "$RUNNER_TEMP/v3/android" && chmod +x gradlew && ./gradlew :nativeapp:assembleNosmsDebug)
          mkdir -p native-smoke-v3
          cp "$RUNNER_TEMP/v3/android/nativeapp/build/outputs/apk/nosms/debug/nativeapp-nosms-debug.apk" \
             native-smoke-v3/nativeapp-v3-nosms-debug.apk
          ls -l native-smoke-v3

      # An in-place update needs the same signing key on both builds; a
      # mismatch would fail `adb install -r`, and the only way past that on a
      # phone is an uninstall, which deletes the ledger.
      - name: Signers of the APKs under test
        continue-on-error: true
        run: |
          signer() { "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$1" | grep -m1 'SHA-256 digest' | sed 's/.*: //'; }
          cur=$(signer android/nativeapp/build/outputs/apk/nosms/debug/nativeapp-nosms-debug.apk)
          echo "nosms (this commit): $cur"
          echo "sms   (this commit): $(signer android/nativeapp/build/outputs/apk/sms/debug/nativeapp-sms-debug.apk)"
          if [ -f native-smoke-v3/nativeapp-v3-nosms-debug.apk ]; then
            old=$(signer native-smoke-v3/nativeapp-v3-nosms-debug.apk)
            echo "nosms (2b0e3c1e):    $old"
            if [ "$old" = "$cur" ]; then echo "same key: the update installs in place"
            else echo "::warning::the version-3 APK is signed with a different key"; fi
          else
            echo "::warning::no version-3 APK was built"
          fi

      - name: Pillow, for the screenshots printed into the log
        run: python -m pip install --quiet pillow

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No AVD cache: the AVD plus its snapshot is gigabytes, against a cold
      # boot of a minute or two, and a stale snapshot is one more way for the
      # test to fail for a reason that is not the app.
      #
      # API 30, the AOSP image: light, and it ships a default SMS app, so an
      # injected message also lands in the inbox the launch-time scan reads.
      # A hardware keyboard keeps the soft keyboard from covering the form.
      - name: Boot an emulator and run the smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # One line: the action runs each line of `script` as its own sh -c.
          script: bash .github/scripts/native-smoke.sh android/nativeapp/build/outputs/apk/nosms/debug/nativeapp-nosms-debug.apk android/nativeapp/build/outputs/apk/sms/debug/nativeapp-sms-debug.apk native-smoke-out native-smoke-v3/nativeapp-v3-nosms-debug.apk

      - name: Upload screenshots, UI dumps and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke
          if-no-files-found: ignore
          path: native-smoke-out/
