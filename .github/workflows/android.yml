name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # NOTE: no web build step. The APK bundles only webshell/ (a static
      # loading screen); the real UI is served by the embedded Flask app.

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        # Chaquopy's buildPython runs pip at build time; it must be on PATH
        # before the Gradle build. Python 3.11 satisfies Chaquopy 16.1.0
        # (requires buildPython >= 3.8).
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
        env:
          # Empty unless configured as repository secrets; the build then
          # produces an unsigned release rather than signing with a repo key.
          SPENDWISE_KEYSTORE_FILE: ${{ secrets.SPENDWISE_KEYSTORE_FILE }}
          SPENDWISE_KEYSTORE_PASSWORD: ${{ secrets.SPENDWISE_KEYSTORE_PASSWORD }}
          SPENDWISE_KEY_ALIAS: ${{ secrets.SPENDWISE_KEY_ALIAS }}
          SPENDWISE_KEY_PASSWORD: ${{ secrets.SPENDWISE_KEY_PASSWORD }}

      # The debug APK is signed with the committed, stable dev keystore, so it
      # installs on any phone and updates over a previous install. For
      # sideloading, this is the one you want.
      - name: Upload Debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-INSTALL-THIS
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Release is signed ONLY when the signing secrets are present. Without
      # them Gradle emits app-release-unsigned.apk, which Android refuses with
      # INSTALL_PARSE_FAILED_NO_CERTIFICATES.
      #
      # These used to be one upload step named "app-release", so an unsigned
      # APK was published under the name that reads like the one to install.
      # Someone downloaded it, sideloaded it, and got a parse failure with
      # nothing in the artifact name to explain why. Two steps now, and the
      # unsigned one says what it is.
      - name: Upload Release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          if-no-files-found: ignore
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK (UNSIGNED — cannot be installed)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-UNSIGNED-cannot-be-installed
          if-no-files-found: ignore
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Explain which APK to install
        if: always()
        run: |
          out=android/app/build/outputs/apk/release
          if [ -f "$out/app-release.apk" ]; then
            echo "::notice::Signed release built. Install 'app-release'."
          else
            echo "::warning::No signing secrets are configured, so the release"\
                 "APK is UNSIGNED and Android will refuse it with"\
                 "INSTALL_PARSE_FAILED_NO_CERTIFICATES."
            echo "::warning::To sideload, download 'app-debug-INSTALL-THIS'."
            echo "::warning::To get a signed release, add the repository"\
                 "secrets SPENDWISE_KEYSTORE_FILE, SPENDWISE_KEYSTORE_PASSWORD,"\
                 "SPENDWISE_KEY_ALIAS and SPENDWISE_KEY_PASSWORD."
          fi
