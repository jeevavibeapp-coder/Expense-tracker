name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # NOTE: no web build step. The APK bundles only webshell/ (a static
      # loading screen); the real UI is served by the embedded Flask app.

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        # Chaquopy's buildPython runs pip at build time; it must be on PATH
        # before the Gradle build. Python 3.11 satisfies Chaquopy 16.1.0
        # (requires buildPython >= 3.8).
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
        env:
          # Empty unless configured as repository secrets; the build then
          # produces an unsigned release rather than signing with a repo key.
          SPENDWISE_KEYSTORE_FILE: ${{ secrets.SPENDWISE_KEYSTORE_FILE }}
          SPENDWISE_KEYSTORE_PASSWORD: ${{ secrets.SPENDWISE_KEYSTORE_PASSWORD }}
          SPENDWISE_KEY_ALIAS: ${{ secrets.SPENDWISE_KEY_ALIAS }}
          SPENDWISE_KEY_PASSWORD: ${{ secrets.SPENDWISE_KEY_PASSWORD }}

      # The release APK is now always signed (repo secrets if present, the
      # stable committed key otherwise), and release builds are not
      # debuggable. That combination is what gets past Play Protect and MIUI:
      # a debuggable app requesting READ_SMS is blocked hardest, which is why
      # the debug build was refused with INSTALL_FAILED_VERIFICATION_FAILURE.
      - name: Upload Release APK (install this one)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-INSTALL-THIS
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/app-release.apk

      # Kept for debugging on a machine with adb attached. Do not sideload it:
      # it is debuggable and Play Protect blocks it.
      - name: Upload Debug APK (for adb debugging only)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-for-adb-only
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Report what was built
        if: always()
        run: |
          out=android/app/build/outputs/apk/release
          if [ -f "$out/app-release-unsigned.apk" ]; then
            echo "::error::The release APK came out UNSIGNED. It cannot be"\
                 "installed. This should not happen — build.gradle falls back"\
                 "to the committed key when no secrets are set."
            exit 1
          fi
          if [ -n "${SPENDWISE_KEYSTORE_FILE}" ]; then
            echo "::notice::Release signed with your repository secrets."
          else
            echo "::notice::Release signed with the committed stable key."\
                 "Fine for your own phone. Set the SPENDWISE_* secrets before"\
                 "distributing to anyone else."
          fi
          echo "::notice::Install 'app-release-INSTALL-THIS'. Play Protect may"\
               "still warn because the app reads bank SMS — that warning is"\
               "about the permission, not about the app."
        env:
          SPENDWISE_KEYSTORE_FILE: ${{ secrets.SPENDWISE_KEYSTORE_FILE }}
