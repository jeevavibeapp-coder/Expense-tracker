name: Core logic tests

# The domain logic has no Android dependency, so it is verified on a plain
# JVM in seconds — no SDK, no emulator, no APK. That is what makes it
# practical to re-check the parser on every push, and the parser is where the
# hard-won knowledge in this project actually lives.

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch the Kotlin compiler
        run: |
          mkdir -p /opt/kotlin
          base=https://repo1.maven.org/maven2
          curl -sSL -o /opt/kotlin/kotlin-compiler.jar \
            $base/org/jetbrains/kotlin/kotlin-compiler/2.1.0/kotlin-compiler-2.1.0.jar
          curl -sSL -o /opt/kotlin/kotlin-stdlib.jar \
            $base/org/jetbrains/kotlin/kotlin-stdlib/2.1.0/kotlin-stdlib-2.1.0.jar
          curl -sSL -o /opt/kotlin/kotlin-reflect.jar \
            $base/org/jetbrains/kotlin/kotlin-reflect/2.1.0/kotlin-reflect-2.1.0.jar
          curl -sSL -o /opt/kotlin/coroutines.jar \
            $base/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.1/kotlinx-coroutines-core-jvm-1.8.1.jar
          curl -sSL -o /opt/kotlin/trove4j.jar \
            $base/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          curl -sSL -o /opt/kotlin/annotations.jar \
            $base/org/jetbrains/annotations/23.0.0/annotations-23.0.0.jar
          printf '%s\n' '#!/bin/bash' \
            'KH=/opt/kotlin' \
            'CP="$KH/kotlin-compiler.jar:$KH/coroutines.jar:$KH/trove4j.jar:$KH/kotlin-stdlib.jar:$KH/kotlin-reflect.jar:$KH/annotations.jar"' \
            'exec java -cp "$CP" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -no-stdlib "$@"' \
            > /usr/local/bin/kotlinc-jvm
          chmod +x /usr/local/bin/kotlinc-jvm

      - name: Run the core tests
        run: ./core/run-tests.sh
