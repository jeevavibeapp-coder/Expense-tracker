{% extends "base.html" %}
{% block auth %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">💸 {{ app_name }}</div>
    <p class="sub">Create your account.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/signup">
      <div class="field"><label for="full_name">Full name</label>
        <input id="full_name" name="full_name" value="{{ full_name or '' }}" required autofocus></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}" required></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required>
        <small>At least 8 characters.</small></div>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
  </div>
</div>
{% endblock %}
