{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block auth %}
<div class="auth">
  <div class="logo">{{ m.icon('wallet') }}</div>
  <h1>Welcome back</h1>
  <p class="sub">Smart expense tracking with merchant intelligence.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div class="field"><label class="lbl">Email</label>
      <input name="email" type="email" autocomplete="email" value="{{ email or '' }}" required autofocus></div>
    <div class="field"><label class="lbl">Password</label>
      <input name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="auth-alt">New here? <a href="/signup">Create an account</a></p>
</div>
{% endblock %}
