{% import "_macros.html" as m %}
{% if best %}
<div style="margin-top:10px; padding:12px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-sm)">
  <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
    <span class="faint" style="font-size:12px">Engine suggests</span>
    <strong style="font-size:14px">{{ best.merchant_name }}</strong>
    {{ m.confidence_badge(best.confidence) }}{{ m.decision_label(decision) }}
  </div>
  {{ m.breakdown_bars(breakdown) }}
</div>
{% else %}
<div class="faint" style="margin-top:8px; font-size:12px">✨ New payee — it'll be learned once you save it.</div>
{% endif %}
