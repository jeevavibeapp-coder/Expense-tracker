// The native app: Kotlin + Room + Compose, no interpreter and no server.
//
// A SEPARATE module from :app on purpose. :app is the shipping Capacitor +
// Chaquopy build, and while this one is being finished it must not be able to
// break that one — a build error here should cost a red job, not the only
// installable APK.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.jeevavibeapp.spendwise'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.jeevavibeapp.spendwise.native"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "2.0"
    }

    // Same two flavours as :app, and for the same reason: Play Protect
    // refuses to sideload anything declaring SMS permissions in India,
    // Singapore, Thailand and Brazil.
    flavorDimensions 'capture'
    productFlavors {
        sms   { dimension 'capture' }
        nosms { dimension 'capture' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// Room writes its schema here so migrations can be diffed in review. A finance
// app with no cloud copy cannot afford a destructive fallback, so every schema
// change has to ship a real migration.
//
// Top level, not inside defaultConfig: `ksp` is an extension the KSP plugin
// adds to the PROJECT, and nesting it in defaultConfig only ever resolved by
// Groovy falling back up the owner chain — it is not a DefaultConfig method.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation project(':core')

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"

    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
