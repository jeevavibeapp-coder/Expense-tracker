apply plugin: 'com.android.application'
// Chaquopy must be applied AFTER com.android.application.
apply plugin: 'com.chaquo.python'

android {
    namespace = "com.jeevavibeapp.spendwise"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jeevavibeapp.spendwise"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // Chaquopy ships a full CPython runtime PER ABI, so every entry here
        // is another copy of the interpreter and stdlib inside the APK. x86
        // and x86_64 are emulator and Chromebook targets — no phone runs
        // them — so carrying all four meant roughly half the native payload
        // could never execute on the device it was installed on. Add them
        // back if you need to run this in an emulator.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        // Chaquopy: pure-Python runtime dependency (Flask pulls Werkzeug,
        // Jinja2, click, itsdangerous, markupsafe — all pure Python).
        python {
            // Match the host Python version so .pyc files are compatible on-device.
            version "3.11"
            buildPython "python3"
            pip {
                install "Flask==3.1.0"
                // Production WSGI server (pure Python, Chaquopy-compatible).
                install "waitress==3.0.2"
            }
        }
    }

    // Chaquopy: point the Python source set at the repo's package directory so
    // `spendwise` (and `spendwise.android_entry`) become importable on-device.
    // Path is relative to android/app/ -> /home/user/Expense-tracker/python_app
    sourceSets {
        main {
            python.srcDir "../../python_app"
        }
    }
    signingConfigs {
        // DEBUG-ONLY key. Debug signing material is not a secret by design
        // (Android ships a world-known debug keystore), and keeping a stable
        // one means sideloaded debug builds keep updating over an existing
        // install instead of forcing an uninstall — which would destroy the
        // user's on-device financial history.
        // It MUST NOT be used for release.
        devDebug {
            storeFile file('spendwise.jks')
            storePassword 'spendwise'
            keyAlias 'spendwise'
            keyPassword 'spendwise'
        }
        // Release signing prefers the environment (CI secrets or a local,
        // gitignored keystore). Nothing production-grade lives in the repo: a
        // committed key lets anyone sign an APK that installs as a legitimate
        // update over the real app and inherits its sandbox — including the
        // finance database. Set these before distributing to anyone else.
        release {
            def ksFile = System.getenv('SPENDWISE_KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('SPENDWISE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SPENDWISE_KEY_ALIAS')
                keyPassword System.getenv('SPENDWISE_KEY_PASSWORD')
            }
        }
    }
    // Two flavours of the same app, same applicationId and same signing key,
    // so a phone can move from one to the other later without losing its
    // ledger. See src/nosms/AndroidManifest.xml for why the second exists.
    flavorDimensions "capture"
    productFlavors {
        sms   { dimension "capture" }      // the full app, needs sideload allowances
        nosms { dimension "capture" }      // installs where Play Protect blocks SMS
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.devDebug
        }
        release {
            minifyEnabled false
            // Signing policy, and the reasoning behind it.
            //
            // This previously emitted an UNSIGNED APK when no credentials were
            // present, "rather than silently signing with a fallback key".
            // Principled, and it produced a file Android flatly refuses to
            // install (INSTALL_PARSE_FAILED_NO_CERTIFICATES). The only
            // installable artifact left was the debug build — which is
            // debuggable, and a debuggable app requesting READ_SMS is the
            // profile Play Protect and MIUI block hardest. So the strict
            // policy did not produce a safer app; it produced no app.
            //
            // The fallback is the same stable key the debug build uses. What a
            // private release key actually buys is store distribution and
            // protection against a forged update — and a forged update still
            // has to reach the device, at which point an attacker could just
            // install their own app. Against that: a STABLE key means updates
            // install over the previous version instead of requiring an
            // uninstall, and on this app an uninstall destroys the ledger,
            // because there is no cloud copy by design.
            //
            // Set the SPENDWISE_* variables before giving the APK to anyone
            // else; that path always wins over this one.
            if (System.getenv('SPENDWISE_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.devDebug
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WindowInsetsCompat — handles edge-to-edge on all API levels including 35+
    implementation "androidx.core:core:$androidxCoreVersion"
    // WebKit extras: safe-browsing, modern WebView feature detection
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // WorkManager: the only scheduler OEM battery managers must honour.
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
