apply plugin: 'com.android.application'
// Chaquopy must be applied AFTER com.android.application.
apply plugin: 'com.chaquo.python'

android {
    namespace = "com.jeevavibeapp.spendwise"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jeevavibeapp.spendwise"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // Chaquopy: ship a native Python runtime for all common ABIs so the
        // embedded Flask server runs on any device/emulator.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        // Chaquopy: pure-Python runtime dependency (Flask pulls Werkzeug,
        // Jinja2, click, itsdangerous, markupsafe — all pure Python).
        python {
            // Match the host Python version so .pyc files are compatible on-device.
            version "3.11"
            buildPython "python3"
            pip {
                install "Flask"
            }
        }
    }

    // Chaquopy: point the Python source set at the repo's package directory so
    // `spendwise` (and `spendwise.android_entry`) become importable on-device.
    // Path is relative to android/app/ -> /home/user/Expense-tracker/python_app
    sourceSets {
        main {
            python.srcDir "../../python_app"
        }
    }
    signingConfigs {
        spendwise {
            // CI/local overrides via environment; the committed dev keystore is
            // the fallback so builds stay reproducible. Before a store release,
            // set these secrets and rotate the key (see README).
            def ksFile = System.getenv('SPENDWISE_KEYSTORE_FILE')
            storeFile file(ksFile ?: 'spendwise.jks')
            storePassword System.getenv('SPENDWISE_KEYSTORE_PASSWORD') ?: 'spendwise'
            keyAlias System.getenv('SPENDWISE_KEY_ALIAS') ?: 'spendwise'
            keyPassword System.getenv('SPENDWISE_KEY_PASSWORD') ?: 'spendwise'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.spendwise
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.spendwise
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WindowInsetsCompat — handles edge-to-edge on all API levels including 35+
    implementation "androidx.core:core:$androidxCoreVersion"
    // WebKit extras: safe-browsing, modern WebView feature detection
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
