// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.4'
        // Chaquopy 16.1.0 adds support for Android Gradle plugin 8.9 - 8.13
        // (AGP 8.9.1 here) and requires minSdk 24 (matches variables.gradle).
        // Available on Maven Central (declared below), so no extra repo needed.
        classpath 'com.chaquo.python:gradle:16.1.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
