{% extends "base.html" %}
{% block auth %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">💸 {{ app_name }}</div>
    <p class="sub">Smart expense tracking with merchant intelligence.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="auth-alt">No account? <a href="/signup">Create one</a></p>
  </div>
</div>
{% endblock %}
